name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    name: Continuous Integration (CI) - Tests & Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar pruebas unitarias y reporte de cobertura
        run: npm test

      - name: 5. Autenticación en Docker Hub con PAT
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 6. Configurar Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: 7. Compilar y publicar imagen Docker (:latest y :${{ github.sha }})
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:${{ github.sha }}

  cd:
    name: Continuous Deployment (CD) - AWS EC2
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Desplegar contenedor en AWS EC2 vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== 1. Autenticación en Docker Hub ==="
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "=== 2. Descargando última versión de la imagen ==="
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest

            echo "=== 3. Deteniendo contenedor previo (si existe) ==="
            docker stop gestdevops-api || true
            docker rm gestdevops-api || true

            echo "=== 4. Iniciando nuevo contenedor mapeado al puerto 80 ==="
            docker run -d \
              --name gestdevops-api \
              -p 80:3000 \
              --restart always \
              ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_REPO }}:latest

            echo "=== 5. Limpiando imágenes huérfanas antiguas ==="
            docker image prune -f

            echo "=== Despliegue completado con éxito ==="
